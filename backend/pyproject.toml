[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cammy"
version = "0.1.0"
description = "Real-time face detection/recognition and hand gesture recognition system"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Cammy Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
face = [
    "deepface>=0.0.81",
]
hand = [
    "mediapipe>=0.10.0",
]
action = [
    "pyautogui>=0.9.54",
    "requests>=2.28.0",
]
server = [
    "websockets>=12.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.scripts]
cammy = "cammy.main:main"

[tool.setuptools.packages.find]
where = ["src"]
