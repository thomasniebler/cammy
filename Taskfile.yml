version: '3'

env:
  PYTHON_BIN: "{{.PYTHON_BIN}}"
  BACKEND_DIR: "./backend"
  FRONTEND_DIR: "./frontend"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # Installation
  install:
    desc: Install all dependencies
    cmds:
      - cd {{.BACKEND_DIR}} && uv pip install -e ".[dev]"
      - cd {{.FRONTEND_DIR}} && npm install

  install-backend:
    desc: Install backend dependencies
    cmds:
      - cd {{.BACKEND_DIR}} && uv pip install -e ".[dev]"

  install-frontend:
    desc: Install frontend dependencies
    cmds:
      - cd {{.FRONTEND_DIR}} && npm install

  # Development
  dev:
    desc: Start development mode (frontend + backend)
    cmds:
      - task: dev-backend
      - task: dev-frontend

  dev-backend:
    desc: Start backend server
    dir: {{.BACKEND_DIR}}
    cmds:
      - source .venv/bin/activate && python -m cammy.main

  dev-frontend:
    desc: Start frontend dev server
    dir: {{.FRONTEND_DIR}}
    cmds:
      - npm run dev

  # Production
  build:
    desc: Build everything for production
    cmds:
      - task: build-backend
      - task: build-frontend

  build-backend:
    desc: Build backend (install in dev mode)
    cmds:
      - cd {{.BACKEND_DIR}} && uv pip install -e .

  build-frontend:
    desc: Build frontend for production
    dir: {{.FRONTEND_DIR}}
    cmds:
      - npm run build

  # Testing
  test:
    desc: Run all tests
    dir: {{.BACKEND_DIR}}
    cmds:
      - source .venv/bin/activate && python -m pytest tests/ -v

  test-coverage:
    desc: Run tests with coverage
    dir: {{.BACKEND_DIR}}
    cmds:
      - source .venv/bin/activate && python -m pytest tests/ --cov=src/cammy --cov-report=html

  # Linting
  lint:
    desc: Run linting
    cmds:
      - cd {{.BACKEND_DIR}} && uv pip install ruff && ruff check src/
      - cd {{.FRONTEND_DIR}} && npm run lint 2>/dev/null || true

  # Cleanup
  clean:
    desc: Clean up build artifacts
    cmds:
      - cd {{.BACKEND_DIR}} && rm -rf .pytest_cache __pycache__ src/**/__pycache__
      - cd {{.FRONTEND_DIR}} && rm -rf dist node_modules

  # Docker
  docker-build:
    desc: Build Docker image
    cmds:
      - docker build -t cammy:latest .

  docker-run:
    desc: Run Docker container
    cmds:
      - docker run -p 5173:5173 -p 8765:8765 -p 8000:8000 cammy:latest

  # System info
  info:
    desc: Show system information
    cmds:
      - echo "Backend Python: $(python3 --version)"
      - echo "Frontend Node: $(node --version)"
      - echo "UV: $(uv --version)"
