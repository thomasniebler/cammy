version: '3'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # Installation
  install:
    desc: Install all dependencies
    deps:
      - install-backend
      - install-frontend

  install-backend:
    desc: Install backend dependencies (includes dev extras)
    dir: backend
    cmds:
      - uv sync --extra dev

  install-frontend:
    desc: Install frontend dependencies
    dir: frontend
    cmds:
      - npm install

  # Development
  dev:
    desc: Start backend and frontend dev servers (in parallel)
    deps:
      - dev-backend
      - dev-frontend

  dev-backend:
    desc: Start backend server
    dir: backend
    cmds:
      - uv run python -m cammy.main

  dev-frontend:
    desc: Start frontend dev server
    dir: frontend
    cmds:
      - npm run dev

  # Production
  build:
    desc: Build everything for production
    deps:
      - build-backend
      - build-frontend

  build-backend:
    desc: Sync backend production dependencies
    dir: backend
    cmds:
      - uv sync

  build-frontend:
    desc: Build frontend for production
    dir: frontend
    cmds:
      - npm run build

  # Testing
  test:
    desc: Run all tests
    dir: backend
    cmds:
      - uv run pytest tests/ -v

  test-coverage:
    desc: Run tests with coverage
    dir: backend
    cmds:
      - uv run pytest tests/ --cov=src/cammy --cov-report=html

  # Linting
  lint:
    desc: Lint backend with ruff
    dir: backend
    cmds:
      - uv run ruff check src/

  # Cleanup
  clean:
    desc: Clean up build artifacts
    deps:
      - clean-backend
      - clean-frontend

  clean-backend:
    desc: Clean backend build artifacts
    dir: backend
    cmds:
      - rm -rf .pytest_cache htmlcov .coverage
      - find . -type d -name __pycache__ -exec rm -rf {} +

  clean-frontend:
    desc: Clean frontend build artifacts
    dir: frontend
    cmds:
      - rm -rf dist node_modules

  # Docker
  docker-build:
    desc: Build Docker image
    cmds:
      - docker build -t cammy:latest .

  docker-run:
    desc: Run Docker container
    cmds:
      - docker run -p 5173:5173 -p 8765:8765 -p 8000:8000 cammy:latest

  # System info
  info:
    desc: Show system information
    cmds:
      - python3 --version
      - node --version
      - uv --version
